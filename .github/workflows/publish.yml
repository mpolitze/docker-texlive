name: Publish Docker Image

on:
  schedule:
    # run on 1th and 15th of each month
    - cron: '1 2 1,15 * *'
  push:
    branches:
      - main
      - ghactionstest
      - ghactiontest
    tags:
      - '*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write

jobs:
  build-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build arm64 image
        uses: docker/build-push-action@v6
        with:
          file: Dockerfile.simple
          push: false
          platforms: linux/arm64
          tags: localhost:5000/texlive:arm64
          cache-to: type=gha
          outputs: type=docker,dest=${{ runner.temp }}/texlive-arm64.tar
      #- name: Upload arm64 image as artifact
      #  uses: actions/upload-artifact@v4
      #  with:
      #    name: texlive-arm64
      #    path: ${{ runner.temp }}/texlive-arm64.tar
      #    retention-days: 1
  
  build:
    runs-on: ubuntu-latest
    needs: build-arm64
    services:
      registry:
        image: registry:2
        ports:
        - 5000:5000
    steps:
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
         # images: |
         #   danteev/texlive
         #   ghcr.io/dante-ev/texlive
          tags: |
            type=schedule,pattern={{date 'YYYY-MM-DD'}}
            type=ref,event=tag
            type=edge,branch=main
            type=raw,value=test,enable=${{ github.event_name == 'workflow_dispatch' && github.ref_name == 'ghactiontest' }}
      # - name: Login to DockerHub
      #   uses: docker/login-action@v2
      #   with:
      #     username: ${{ secrets.DOCKER_USERNAME }}
      #     password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # - name: Download arm64 image from artifacts
      #   uses: actions/download-artifact@v4
      #   with:
      #     name: texlive-arm64
      #     path: ${{ runner.temp }}
      # - name: Load arm64 image
      #   run: |
      #     docker load --input ${{ runner.temp }}/texlive-arm64.tar
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      # - name: Build and push
      #   uses: docker/build-push-action@v6
      #   with:
      #     file: Dockerfile.simple
      #     push: false
      #     load: true
      #     platforms: linux/amd64
      #     tags: localhost:5000/texlive:amd64
      # - name: Create multi arch manifest
      #   run: |
      #       docker images -a
      #       docker push localhost:5000/texlive:arm64
      #       docker push localhost:5000/texlive:amd64
      #       docker buildx imagetools create --tag ghcr.io/mpolitze/docker-texlive:current localhost:5000/texlive:arm64 localhost:5000/texlive:amd64
      - name: Push image
        uses: docker/build-push-action@v6
        with:
          file: Dockerfile.simple
          cache-from: type=gha
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      # - uses: actions/checkout@v4
      # - uses: gautamkrishnar/keepalive-workflow@v2
