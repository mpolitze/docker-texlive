name: Publish Docker Image

on:
  schedule:
    # run on 1th and 15th of each month
    - cron: '1 2 1,15 * *'
  push:
    branches:
      - main
      - ghactionstest
    tags:
      - '*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write

jobs:
  build-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          file: Dockerfile.simple
          push: false
          platforms: linux/arm64
          tags: local/texlive:arm64
          outputs: type=docker,dest=${{ runner.temp }}/texlive-arm64.tar
      - name: Upload arm64 image as artifact
        uses: actions/upload-artifact@v4
        with:
          name: texlive-arm64
          path: ${{ runner.temp }}/texlive-arm64.tar
          retention-days: 1
  
  build:
    runs-on: ubuntu-latest
    needs: build-arm64
    steps:
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: |
            danteev/texlive
            ghcr.io/dante-ev/texlive
          tags: |
            type=schedule,pattern={{date 'YYYY-MM-DD'}}
            type=ref,event=tag
            type=edge,branch=main
      # - name: Login to DockerHub
      #   uses: docker/login-action@v2
      #   with:
      #     username: ${{ secrets.DOCKER_USERNAME }}
      #     password: ${{ secrets.DOCKER_PASSWORD }}
      # - name: Login to GitHub Container Registry
      #   uses: docker/login-action@v2
      #   with:
      #     registry: ghcr.io
      #     username: koppor
      #     password: ${{ secrets.CR_PAT }}
      - name: Download arm64 image from artifacts
        uses: actions/download-artifact@v4
        with:
          name: texlive-arm64
          path: ${{ runner.temp }}
      - name: Load arm64 image
        run: |
          docker load --input ${{ runner.temp }}/texlive-arm64.tar
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          file: Dockerfile.simple
          push: false
          platforms: linux/amd64
          tags: local/texlive:amd64
      - name: Create and push multi arch manifest
        run: |
            docker images -a
            docker manifest create local/texlive:multiarch local/texlive:amd64 local/texlive:arm64
      - name: Image digest
        run: |
            docker manifest inspect
            echo ${{ steps.docker_build.outputs.digest }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          file: Dockerfile.simple
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      # - uses: actions/checkout@v4
      # - uses: gautamkrishnar/keepalive-workflow@v2
